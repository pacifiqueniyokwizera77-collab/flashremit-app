<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E3B35">
<title>Pax International Travels and Services</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B8892B'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' text-anchor='middle' fill='%230E3B35'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F5F4;
    --surface:#FFFFFF;
    --surface-2:#F6F8F7;
    --line:#E0E7E4;
    --ink:#13201E;
    --muted:#5D6D69;
    --brand:#0E3B35;
    --brand-2:#145248;
    --brand-soft:#E5EFEC;
    --gold:#B8892B;
    --gold-soft:#F7EFDD;
    --good:#1E7A4C;  --good-soft:#E5F3EB;
    --bad:#B42318;   --bad-soft:#FBEAE8;
    --warn:#8A5A00;  --warn-soft:#FFF3D6;
    --info:#1D5FA8;  --info-soft:#E8F0FB;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  button,input,select{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .num,td,.kpi .v,.convert b{font-variant-numeric:tabular-nums;}
  svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- Shell ---------- */
  .shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;}
  .side{position:sticky;top:0;height:100vh;background:var(--brand);color:#E6EFEC;display:flex;flex-direction:column;gap:2px;padding:22px 14px 18px;overflow-y:auto;}
  .logo{display:flex;gap:11px;align-items:center;}
  .side .logo{padding:2px 8px 26px;}
  .mark{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--brand);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:700;font-size:20px;flex:none;}
  .wordmark b{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:#fff;letter-spacing:-.01em;line-height:1.1;}
  .wordmark span{display:block;font-size:12px;color:#A7C1BA;margin-top:2px;}
  .navlink{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:9px;border:0;background:none;color:#C6D8D3;cursor:pointer;text-align:left;font-weight:600;font-size:14px;}
  .navlink:hover{background:rgba(255,255,255,.07);color:#fff;}
  .navlink.active{background:#fff;color:var(--brand);}
  .navlink .badge{margin-left:auto;}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;line-height:1;}
  .me{display:flex;gap:10px;align-items:center;}
  .side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:16px 6px 0;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;border:0;cursor:default;}
  .me .who{min-width:0;flex:1;}
  .me .who b{display:block;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .me .who span{font-size:12px;color:#A7C1BA;}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;}
  .side .iconbtn,.topbar .iconbtn{background:transparent;border-color:rgba(255,255,255,.2);color:#D3E2DE;}
  .topbar{display:none;}
  main{padding:30px 36px 56px;max-width:1220px;width:100%;}

  /* ---------- Page header ---------- */
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .pagehead h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
  .pagehead p{margin:5px 0 0;color:var(--muted);}
  .pagehead .actions{justify-content:flex-start;}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-width:0;}
  .kpi .k{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:600;}
  .kpi .chip{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none;}
  .kpi .chip svg.i{width:16px;height:16px;}
  .kpi .v{font-size:22px;font-weight:800;margin-top:10px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .v small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
  .kpi .h{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .kpi.hl{background:var(--brand);border-color:var(--brand);color:#fff;}
  .kpi.hl .k,.kpi.hl .h,.kpi.hl .v small{color:#B4CBC5;}
  .kpi.hl .chip{background:rgba(255,255,255,.1);color:var(--gold);}
  .v.good{color:var(--good);} .v.bad{color:var(--bad);} .v.gold{color:var(--gold);}
  .kpi.hl .v.bad{color:#FFB4A8;} .kpi.hl .v.good{color:#9FE0BC;}

  /* ---------- Panels ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden;}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .panel-h h2{margin:0;font-size:15.5px;font-weight:800;display:flex;gap:9px;align-items:center;}
  .panel-h h2 svg.i{color:var(--brand);}
  .panel-b{padding:18px;}
  .panel.flag-bad{border-left:4px solid var(--bad);}
  .panel.flag-bad .panel-h h2 svg.i{color:var(--bad);}
  .panel.flag-warn{border-left:4px solid var(--gold);}
  .panel.flag-warn .panel-h h2 svg.i{color:var(--gold);}
  .panel.calm .panel-h{border-bottom:0;}
  .count{font-weight:700;color:var(--muted);font-size:13px;}

  /* ---------- Tables ---------- */
  .tblwrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
  td{padding:12px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover td{background:#FAFBFB;}
  tfoot td{font-weight:800;border-top:1px solid var(--line);background:var(--surface-2);}
  th.r,td.r{text-align:right;white-space:nowrap;}
  .sub{font-size:12.5px;color:var(--muted);}
  .strong{font-weight:700;}
  .bif{font-weight:800;color:var(--brand);}
  .cell-good{color:var(--good);font-weight:700;} .cell-bad{color:var(--bad);font-weight:700;} .cell-gold{color:var(--gold);font-weight:700;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
  .pill svg.i{width:13px;height:13px;stroke-width:2.2;}
  .pill.attente{background:var(--warn-soft);color:var(--warn);}
  .pill.payee{background:var(--good-soft);color:var(--good);}
  .pill.annulee{background:var(--surface-2);color:var(--muted);}
  .pill.envoye{background:var(--info-soft);color:var(--info);}
  .pill.role{background:var(--brand-soft);color:var(--brand);}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:9px;border:1px solid transparent;background:var(--brand);color:#fff;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;}
  .btn:hover{background:var(--brand-2);}
  .btn.gold{background:var(--gold);} .btn.gold:hover{background:#A57A24;}
  .btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink);} .btn.ghost:hover{background:var(--surface-2);}
  .btn.good{background:var(--good);} .btn.good:hover{background:#196640;}
  .btn.danger{background:var(--bad);}
  .btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px;gap:5px;}
  .btn.sm svg.i{width:15px;height:15px;}
  .btn.sq{width:32px;padding:0;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  td .actions{flex-direction:column;align-items:stretch;min-width:96px;}
  td .actions .btn.sq{width:auto;}
  .linkbtn{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13.5px;}

  /* ---------- Forms ---------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0;}
  .field label{font-size:13px;font-weight:700;color:#33433F;}
  .field .hint{font-size:12.5px;color:var(--muted);}
  input,select{height:44px;width:100%;padding:0 12px;border:1px solid #CBD6D2;border-radius:9px;background:#fff;font-size:15px;}
  input[readonly]{background:var(--surface-2);}
  input:focus,select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(14,59,53,.13);}
  .legend{font-size:14px;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;gap:8px;color:var(--brand);}
  .sep{height:1px;background:var(--line);margin:6px 0 18px;}

  /* conversion strip: the signature element */
  .convert{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.2fr);align-items:center;gap:12px;background:var(--brand);color:#fff;border-radius:12px;padding:18px 20px;margin:4px 0 8px;}
  .convert .step span{display:block;font-size:12.5px;color:#A7C1BA;}
  .convert .step b{display:block;font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .convert .step.final b{color:var(--gold);font-size:25px;}
  .convert .op{font-size:12.5px;font-weight:700;color:#D6E4E0;text-align:center;white-space:nowrap;}
  .convert .op svg.i{display:block;margin:0 auto 3px;color:var(--gold);}
  .convert-note{font-size:12.5px;color:var(--muted);margin-bottom:16px;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .filters select,.filters input{width:auto;min-width:170px;height:40px;font-size:14px;}
  .filters .search{position:relative;flex:1;min-width:220px;}
  .filters .search input{width:100%;padding-left:38px;}
  .filters .search svg.i{position:absolute;left:12px;top:11px;color:var(--muted);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chipbtn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink);flex:none;}
  .chipbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .range{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;}
  .range .field{margin:0;}
  .range input,.range select{height:40px;font-size:14px;}

  .note{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:13.5px;line-height:1.55;}
  .note b{color:var(--ink);}
  .empty{padding:30px 16px;text-align:center;color:var(--muted);}
  .empty svg.i{width:28px;height:28px;color:#A8B6B2;display:block;margin:0 auto 8px;}
  .linkbox{display:flex;gap:8px;}
  .linkbox input{font-size:13px;}

  /* mobile cards (hidden on desktop) */
  .cards{display:none;}
  .tcard{padding:14px 16px;border-bottom:1px solid var(--line);}
  .tcard:last-child{border-bottom:0;}
  .tcard .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .tcard .name{font-weight:800;}
  .tcard .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .tcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .tcard .bif{font-size:16px;white-space:nowrap;}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px;}
  .mini div span{display:block;font-size:12px;color:var(--muted);}
  .mini div b{font-size:14.5px;}

  /* ---------- Auth ---------- */
  .auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);}
  .auth-brand{background:var(--brand);color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;}
  .auth-brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:42px;line-height:1.08;margin:0 0 26px;letter-spacing:-.02em;max-width:520px;}
  .route{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;max-width:440px;}
  .route .dash{flex:1;height:0;border-top:2px dashed rgba(255,255,255,.3);}
  .route svg.i{color:var(--gold);width:22px;height:22px;}
  .auth-brand .foot{color:#A7C1BA;font-size:13.5px;}
  .auth-main{display:grid;place-items:center;padding:36px 20px;}
  .auth-card{width:100%;max-width:400px;}
  .auth-card h2{font-size:24px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  .auth-card .lead{color:var(--muted);margin:0 0 22px;}
  .auth-card .switch{text-align:center;margin-top:18px;color:var(--muted);font-size:13.5px;}
  .rowline{display:flex;justify-content:flex-end;margin:-4px 0 16px;}
  .msg{border-radius:9px;padding:11px 13px;font-size:13.5px;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start;}
  .msg svg.i{margin-top:1px;}
  .msg.bad{background:var(--bad-soft);color:var(--bad);}
  .msg.ok{background:var(--good-soft);color:var(--good);}
  .waiting{text-align:center;}
  .waiting .disc{width:56px;height:56px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;margin:0 auto 16px;}
  .waiting .disc svg.i{width:26px;height:26px;}

  /* ---------- Checklist & gain line ---------- */
  .checklist{border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;margin-bottom:16px;}
  .checkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .checkrow:last-child{border-bottom:0;}
  .checkrow input{width:20px;height:20px;padding:0;accent-color:var(--brand);}
  .checkrow .sub{display:block;}
  .gainline{font-size:13.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:9px;padding:10px 12px;margin:-6px 0 16px;}
  .gainline:empty{display:none;}
  .legend-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .legend-row .legend{margin-bottom:8px;}
  .legend-row .actions{gap:14px;}
  details.linked{margin-top:4px;font-weight:500;}
  details.linked summary{cursor:pointer;font-size:12.5px;color:var(--brand);font-weight:700;}
  details.linked ul{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;color:var(--muted);}
  details.linked li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;}
  td details.linked{text-align:left;}

  /* ---------- Language switch ---------- */
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
  .lang button{border:0;background:#fff;padding:6px 10px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted);letter-spacing:.02em;}
  .lang button.on{background:var(--brand);color:#fff;}
  .side .lang,.topbar .lang{border-color:rgba(255,255,255,.25);}
  .side .lang button,.topbar .lang button{background:transparent;color:#C6D8D3;}
  .side .lang button.on,.topbar .lang button.on{background:#fff;color:var(--brand);}
  .side-lang{margin-top:auto;padding:0 8px 14px;}
  .side-lang + .me{margin-top:0;}
  .auth-top{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .topright{display:flex;align-items:center;gap:8px;}

  /* ---------- Mobile nav ---------- */
  .tabbar{display:none;}
  .sheet-bg{position:fixed;inset:0;background:rgba(9,26,23,.45);z-index:50;display:flex;align-items:flex-end;}
  .sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;}
  .sheet .grab{width:42px;height:4px;border-radius:2px;background:#D3DCD9;margin:6px auto 14px;}
  .sheet .me{padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .sheet .me .who b{color:var(--ink);} .sheet .me .who span{color:var(--muted);}
  .sheet .navlink{color:var(--ink);padding:13px 12px;font-size:15px;}
  .sheet .navlink:hover{background:var(--surface-2);color:var(--ink);}
  .sheet .navlink.active{background:var(--brand-soft);color:var(--brand);}
  .sheet .navlink.out{color:var(--bad);}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px);}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;display:flex;gap:9px;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.2);}
  .toast svg.i{color:#9FE0BC;}
  .toast.bad{background:var(--bad);} .toast.bad svg.i{color:#fff;}
  @media (prefers-reduced-motion:no-preference){
    .toast{animation:pop .22s ease-out;}
    .sheet{animation:up .22s ease-out;}
    @keyframes pop{from{opacity:0;transform:translateY(8px);}}
    @keyframes up{from{transform:translateY(40px);opacity:.6;}}
  }

  @media (max-width:1120px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:1240px){
    .only-desk{display:none;}
    .cards{display:block;}
  }
  @media (max-width:860px){
    body{font-size:15px;}
    .shell{display:block;}
    .side{display:none;}
    .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;background:var(--brand);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));}
    .topbar .mark{width:32px;height:32px;font-size:17px;border-radius:9px;}
    .topbar .wordmark b{font-size:16px;}
    .topbar .wordmark span{font-size:11.5px;}
    main{padding:18px 14px calc(100px + env(safe-area-inset-bottom));}
    .pagehead{margin-bottom:16px;}
    .pagehead h1{font-size:22px;}
    .pagehead .desk-only{display:none;}
    .kpis{gap:10px;margin-bottom:16px;}
    .kpi{padding:13px;}
    .kpi .v{font-size:19px;margin-top:8px;}
    .panel-h{padding:13px 14px;}
    .panel-b{padding:14px;}
    .only-desk{display:none;}
    .cards{display:block;}
    .grid2,.grid3{grid-template-columns:1fr;}
    .convert{grid-template-columns:1fr;gap:4px;padding:16px;}
    .convert .op{text-align:left;display:flex;gap:6px;align-items:center;padding:2px 0;}
    .convert .op svg.i{margin:0;transform:rotate(90deg);}
    .filters{gap:8px;}
    .filters select,.filters input{flex:1 1 140px;min-width:0;}
    .filters .search{flex-basis:100%;}
    .range .field{flex:1 1 130px;}
    .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
    .tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;cursor:pointer;position:relative;}
    .tab svg.i{width:23px;height:23px;}

  [/^Activité le (\S+)(.*)\.$/, 'Activity on $1$2.'],
  [/^Activité du (\S+) au (\S+)(.*)\.$/, 'Activity from $1 to $2$3.'],
  [/^Activité depuis le début(.*)\.$/, 'Activity since the start$1.'],
  [/^le (\d\d\/\d\d\/\d{4})$/, 'on $1'],
  [/^du (\S+) au (\S+)$/, 'from $1 to $2'],
  [/^Semaine du (\S+) au (\S+)$/, 'Week of $1 to $2'],
  [/^(.+), inscrit le (.+)$/, '$1, signed up $2'],
];
function tr(s){
  if(LANG!=='en' || s==null) return s;
  const str = String(s), k = str.trim();
  if(!k) return str;
  if(Object.prototype.hasOwnProperty.call(EN, k)) return str.replace(k, EN[k]);
  for(const [rx, rep] of EN_RX){ if(rx.test(k)) return str.replace(k, k.replace(rx, rep)); }
  return str;
}
function translateDom(root){
  if(LANG!=='en' || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const v = tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue = v; });
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    ['placeholder','title','aria-label'].forEach(a=>{ if(el.hasAttribute(a)) el.setAttribute(a, tr(el.getAttribute(a))); });
  });
}
function ask(msg){ return confirm(tr(msg)); }
function askText(msg, def){ return prompt(tr(msg), def); }

/* ---------- Helpers ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n, dec=2){ return (Number(n)||0).toLocaleString(NUMLOCALE(),{minimumFractionDigits:0, maximumFractionDigits:dec}); }
const pad = n => String(n).padStart(2,'0');
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function today(){ return ymd(new Date()); }
function weekStart(s){ const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); }
function fmtDate(s){ if(!s) return ''; const [y,m,d] = String(s).slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function fmtDT(ts){ if(!ts) return ''; const d = new Date(ts); return d.toLocaleDateString(LOCALE())+(LANG==='en'?' at ':' à ')+d.toLocaleTimeString(LOCALE(),{hour:'2-digit',minute:'2-digit'}); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function longToday(){ return cap(new Date().toLocaleDateString(LOCALE(),{weekday:'long', day:'numeric', month:'long', year:'numeric'})); }
function initials(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function firstName(n){ return String(n||'').trim().split(/\s+/)[0]; }
function siteUrl(){ return location.origin + location.pathname; }
function signupLink(){ return siteUrl() + '#inscription'; }
function role(){ return state.profile ? state.profile.role : null; }

function presetRange(p){
  const t = today();
  switch(p){
    case 'today': return [t, t];
    case 'yesterday': { const y = addDays(t,-1); return [y, y]; }
    case 'week': return [weekStart(t), t];
    case 'last7': return [addDays(t,-6), t];
    case 'month': return [t.slice(0,8)+'01', t];
    case 'lastmonth': { const d = parseYmd(t.slice(0,8)+'01'); d.setDate(0); const e = ymd(d); return [e.slice(0,8)+'01', e]; }
    default: return ['2000-01-01', '2999-12-31'];
  }
}
function inRange(d, r){ return !r || (d >= r[0] && d <= r[1]); }

/* AED ÷ taux AED/USD = USD ; USD × taux USD/BIF = BIF, arrondi au multiple de 50 inférieur */
function computeTx(aed, tauxAedUsd, tauxUsdBif){
  aed = Number(aed)||0; tauxAedUsd = Number(tauxAedUsd)||0; tauxUsdBif = Number(tauxUsdBif)||0;
  if(!aed || !tauxAedUsd || !tauxUsdBif) return { usd: aed && tauxAedUsd ? aed/tauxAedUsd : 0, bifExact:0, bif:0 };
  const usd = aed / tauxAedUsd;
  const bifExact = usd * tauxUsdBif;
  return { usd, bifExact, bif: Math.floor(bifExact / BIF_ROUND_STEP) * BIF_ROUND_STEP };
}

function toast(msg, kind='ok'){
  const box = document.getElementById('toast');

  el.innerHTML = ic(kind==='bad' ? 'alert' : 'check') + '<span></span>';
  el.querySelector('span').textContent = tr(msg);
  box.appendChild(el);
  setTimeout(()=>el.remove(), 3400);
}

/* ---------- Auth ---------- */
function friendlyAuthError(error){
  const m = (error && error.message) || '';
  if(/rate limit/i.test(m)) return "Trop de demandes en peu de temps. Réessayez dans une heure, ou demandez à l'administrateur de créer votre accès.";
  if(/already registered|already been registered/i.test(m)) return "Un compte existe déjà avec cet email. Connectez-vous, ou utilisez « Mot de passe oublié ».";
  if(/confirm/i.test(m)) return "Votre email n'est pas encore confirmé. Ouvrez le lien reçu par email, ou demandez à l'administrateur de valider votre compte.";
  if(/invalid login|invalid credentials/i.test(m)) return "Email ou mot de passe incorrect.";
  if(/password/i.test(m) && /6/.test(m)) return "Le mot de passe doit contenir au moins 6 caractères.";
  return m || "Une erreur est survenue. Réessayez.";
}
async function signIn(email, password){
  state.authError=''; state.authInfo='';

  await afterLogin(data.session);
}

  if(data.session){ await afterLogin(data.session); return; }

}

  state.authInfo = "Si un compte existe avec cet email, un lien pour choisir un nouveau mot de passe vient d'être envoyé. Pensez à regarder dans les spams.";

function txAPayer(){ return state.transactions.filter(t=>t.statut==='EN_ATTENTE'); }
function vsAConfirmer(){ return state.versements.filter(v=>v.statut==='ENVOYE'); }
function pendingUsers(){ return state.profiles.filter(p=>p.statut==='en_attente'); }
function activeTx(range, agentId){
  return state.transactions.filter(t=>t.statut!=='ANNULEE' && inRange(t.date, range) && (!agentId || t.agent_id===agentId));
}
function sum(list, k){ return list.reduce((s,x)=>s + (Number(x[k])||0), 0); }

/* Per-agent summary: clients, amounts, fees, sent to Naomie, remaining with the agent */
function bilan(range, agentId){
  const map = {};
  const ensure = (id, nom) => (map[id] ||= { id, nom, n:0, aed:0, frais:0, fraisEnvoi:0, usd:0, bif:0, aPayer:0, envoye:0, envoyeAttente:0 });
  if(!agentId) state.profiles.filter(p=>p.role==='AGENT' && p.statut==='actif').forEach(p=>ensure(p.id, p.nom));
  activeTx(range, agentId).forEach(t=>{
    const a = ensure(t.agent_id, t.agent_nom);
    a.n++; a.aed += +t.montant_aed; a.frais += +t.frais_aed; a.fraisEnvoi += +(t.frais_envoi_aed||0); a.usd += +t.montant_usd; a.bif += +t.montant_bif;
    if(t.statut==='EN_ATTENTE') a.aPayer++;
  });
  state.versements.filter(v=>inRange(v.date, range) && (!agentId || v.agent_id===agentId)).forEach(v=>{
    const a = ensure(v.agent_id, v.agent_nom);
    if(v.statut==='RECU') a.envoye += +v.montant_aed; else a.envoyeAttente += +v.montant_aed;
  });
  return Object.values(map)
    .map(a=>({ ...a, encaisse: a.aed + a.frais, reste: a.aed + a.frais - a.fraisEnvoi - a.envoye }))
    .sort((x,y)=>x.nom.localeCompare(y.nom));
}
function totals(list){
  const t = {};
  list.forEach(a=>Object.keys(a).forEach(k=>{ if(typeof a[k]==='number') t[k] = (t[k]||0) + a[k]; }));
  return t;
}


/* ---------- Profits (admins) & earnings (agents) ---------- */
function vsById(id){ return state.versements.find(v=>v.id===id); }
/* Selling rate of a transaction = rate Naomie entered on the received transfer that covers it */
function sellRate(t){ const v = t.versement_id ? vsById(t.versement_id) : null; return v && v.statut==='RECU' && v.taux_vente ? +v.taux_vente : null; }
/* Agent earnings per transaction = (fees collected − transfer method fee) ÷ 2 */
function gainOf(t){ return ((+t.frais_aed||0) - (+t.frais_envoi_aed||0)) / 2; }
function txProfit(t){
  const fraisNet = (+t.frais_aed||0) - (+t.frais_envoi_aed||0);
  const usd = (+t.montant_aed) / (+t.taux_aed_usd);
  const rs = sellRate(t);
  const change = rs ? usd * rs - (+t.montant_bif) : null;           // exchange profit in BIF
  const part = fraisNet / 2;                                         // Pax half of net fees (AED)
  const partBif = part / (+t.taux_aed_usd) * (rs || +t.taux_usd_bif); // same, converted to BIF
  return { usd, rs, change, fraisNet, gain: fraisNet / 2, part, partBif, total: change==null ? null : change + partBif };
}
function unpaidGains(agentId){ return state.transactions.filter(t=>t.statut!=='ANNULEE' && !t.gain_paiement_id && (!agentId || t.agent_id===agentId)); }
function profitsRange(){
  const s = state.pf;
  if(s.preset==='custom') return [s.from || today(), s.to || today()];
  if(s.preset==='all') return null;
  return presetRange(s.preset);
}
function rangeLabel(range){ return range ? (range[0]===range[1] ? `le ${fmtDate(range[0])}` : `du ${fmtDate(range[0])} au ${fmtDate(range[1])}`) : 'depuis le début'; }
function presetChips(grp){
  const s = state[grp];
  return `<div class="chips" role="group" aria-label="Période">${PRESETS.map(([k,l])=>`<button class="chipbtn ${s.preset===k?'on':''}" data-preset="${grp}:${k}">${l}</button>`).join('')}</div>`;
}
async function payAgent(id){
  const list = unpaidGains(id);
  const amt = list.reduce((a,t)=>a+gainOf(t),0);
  const p = profileById(id) || { nom: (list[0]||{}).agent_nom || 'agent' };
  if(!list.length){ toast('Aucun gain à payer', 'bad'); return; }
  if(!ask(`Payer ${fmt(amt)} AED à ${p.nom} pour ${list.length} transaction(s) et remettre ses gains à zéro ?`)) return;
  const { error } = await sb.rpc('admin_pay_agent', { p_agent:id, p_note:null });
  if(error){ toast(error.message, 'bad'); return; }
  await loadAll();
  toast(`Paiement de ${fmt(amt)} AED enregistré pour ${p.nom}`);
}
function deletePaiement(id){
  if(!ask('Annuler ce paiement ? Les gains correspondants redeviendront « à payer ».')) return;
  run(sb.from('paiements_agents').delete().eq('id', id), 'Paiement annulé');
}

function attachAuthHandlers(){
  const f = document.getElementById('authForm');
  if(f) f.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(f);
    f.querySelector('button[type=submit]').disabled = true;
    const v = f.dataset.view;
    if(v==='signup') signUp(String(fd.get('nom')).trim(), String(fd.get('email')).trim(), fd.get('password'));
    else if(v==='forgot') sendReset(String(fd.get('email')).trim());
    else if(v==='recovery') setNewPassword(fd.get('password'), fd.get('password2'));
    else signIn(String(fd.get('email')).trim(), fd.get('password'));
  };
  document.querySelectorAll('[data-go]').forEach(b=> b.onclick = (e)=>{
    e.preventDefault(); state.authView = b.dataset.go; state.authError=''; state.authInfo=''; render();
  });
}

/* ---------- Pages ---------- */
function renderPage(){
  switch(state.page){
    case 'new': return isBuja() ? pageDashboard() : pageNew();
    case 'transactions': return pageTransactions();
    case 'versements': return pageVersements();
    case 'stats': return pageStats();
    case 'users': return isAdmin() ? pageUsers() : pageDashboard();
    case 'profits': return isAgent() ? pageGains() : pageProfits();

  }
}

    <div class="v ${cls}">${value}${unit?`<small>${unit}</small>`:''}</div>

}

}

/* Transactions */
function filteredTx(){
  const f = state.txf;
  const range = f.periode==='all' ? null : presetRange(f.periode);
  const q = f.q.trim().toLowerCase();
  return state.transactions.filter(t=>
    inRange(t.date, range) &&
    (!f.agent || t.agent_id===f.agent) &&
    (!f.statut || t.statut===f.statut) &&
    (!q || [t.client, t.beneficiaire, t.beneficiaire_tel, t.client_tel, t.agent_nom].some(x=>String(x||'').toLowerCase().includes(q))));
}
function agentOptions(selected){
  const ids = new Map();
  state.profiles.filter(p=>p.role==='AGENT').forEach(p=>ids.set(p.id, p.nom));
  state.transactions.forEach(t=>{ if(!ids.has(t.agent_id)) ids.set(t.agent_id, t.agent_nom); });
  return `<option value="">Tous les agents</option>` + [...ids.entries()].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,nom])=>`<option value="${esc(id)}" ${selected===id?'selected':''}>${esc(nom)}</option>`).join('');
}
function periodOptions(sel){
  return [['all','Toutes les dates'],['today',"Aujourd'hui"],['week','Cette semaine'],['month','Ce mois']]
    .map(([v,l])=>`<option value="${v}" ${sel===v?'selected':''}>${l}</option>`).join('');
}
function pageTransactions(){
  const f = state.txf;
  const list = filteredTx();
  const act = list.filter(t=>t.statut!=='ANNULEE');
  return `

function txActions(t){

}

    <div class="tcard">
      <div class="row">
        <div style="min-width:0;"><div class="name">${esc(t.beneficiaire)}</div><div class="meta">${esc(t.mode_reception||'')} ${esc(t.beneficiaire_tel||'')}</div></div>

      </div>
      <div class="meta" style="margin-top:6px;">${fmtDate(t.date)}, client ${esc(t.client)}${staff?`, agent ${esc(t.agent_nom)}`:''}</div>
      <div class="meta">${fmt(t.montant_aed)} AED + ${fmt(t.frais_aed)} AED de frais, taux ${fmt(t.taux_usd_bif)}${t.methode_envoi?`, ${esc(t.methode_envoi)} −${fmt(t.frais_envoi_aed)} AED`:''}</div>
      <div class="foot">${statusPill(TX_STATUTS, t.statut)}<div class="actions">${txActions(t)}</div></div>

function openTxForVersement(){ return state.transactions.filter(t=>t.agent_id===state.profile.id && !t.versement_id && t.statut!=='ANNULEE'); }
function amountToSend(t){ return (+t.montant_aed) + (+t.frais_aed) - (+t.frais_envoi_aed||0); }
function linkedTx(v){ return state.transactions.filter(t=>t.versement_id===v.id); }
function linkedCount(v){ return linkedTx(v).length; }
function linkedDetails(v){
  const l = linkedTx(v);
  if(!l.length) return `<div class="sub">0 transaction(s) liée(s)</div>`;
  return `<details class="linked"><summary>${l.length} transaction(s) liée(s)</summary><ul>${l.map(t=>`<li><span>${esc(t.beneficiaire)}</span><span>${fmt(t.montant_aed)} AED</span></li>`).join('')}</ul></details>`;

function vsFeeText(v){ return (+v.frais_envoi_aed>0) ? `${esc(v.methode_envoi||v.moyen||'')} −${fmt(v.frais_envoi_aed)} AED` : esc(v.moyen||''); }
function vsActions(v){

/* Statistics */
const PRESETS = [['today',"Aujourd'hui"],['yesterday','Hier'],['week','Cette semaine'],['last7','7 derniers jours'],['month','Ce mois'],['lastmonth','Mois dernier'],['all','Depuis le début'],['custom','Dates choisies']];
function statsRange(){
  const s = state.st;
  if(s.preset==='custom') return [s.from || today(), s.to || today()];
  if(s.preset==='all') return null;
  return presetRange(s.preset);
}
function groupKey(d, g){ return g==='month' ? d.slice(0,7) : g==='week' ? weekStart(d) : d; }
function groupLabel(k, g){
  if(g==='month'){ const [y,m] = k.split('-'); return cap(new Date(+y, +m-1, 1).toLocaleDateString(LOCALE(),{month:'long', year:'numeric'})); }
  if(g==='week') return `Semaine du ${fmtDate(k).slice(0,5)} au ${fmtDate(addDays(k,6)).slice(0,5)}`;
  return cap(parseYmd(k).toLocaleDateString(LOCALE(),{weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}));
}
function pageStats(){
  const s = state.st;
  const range = statsRange();
  const agentId = isAgent() ? state.profile.id : (s.agent || null);
  const tx = activeTx(range, agentId);
  const vs = state.versements.filter(v=>inRange(v.date, range) && (!agentId || v.agent_id===agentId));
  const envoye = sum(vs.filter(v=>v.statut==='RECU'),'montant_aed');
  const aed = sum(tx,'montant_aed'), frais = sum(tx,'frais_aed');
  const g = s.group;
  const groups = {};
  tx.forEach(t=>{ const k = groupKey(t.date, g); const o = (groups[k] ||= { n:0, aed:0, frais:0, bif:0, envoye:0 }); o.n++; o.aed += +t.montant_aed; o.frais += +t.frais_aed; o.bif += +t.montant_bif; });
  vs.filter(v=>v.statut==='RECU').forEach(v=>{ const k = groupKey(v.date, g); const o = (groups[k] ||= { n:0, aed:0, frais:0, bif:0, envoye:0 }); o.envoye += +v.montant_aed; });
  const rows = Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));
  const rangeText = range ? (range[0]===range[1] ? `le ${fmtDate(range[0])}` : `du ${fmtDate(range[0])} au ${fmtDate(range[1])}`) : 'depuis le début';
  const fromVal = range ? range[0] : '';

    </tbody><tfoot><tr><td>Total</td><td class="r">${tx.length}</td><td class="r">${fmt(aed)} AED</td><td class="r">${fmt(frais)} AED</td><td class="r">${fmt(sum(tx,'montant_bif'),0)} BIF</td><td class="r">${fmt(envoye)} AED</td></tr></tfoot></table></div>
    <div class="cards">${rows.map(([k,o])=>`
      <div class="tcard"><div class="row"><div class="name">${groupLabel(k,g)}</div><div class="strong">${o.n} transaction${o.n>1?'s':''}</div></div>
        <div class="mini">
          <div><span>Argent clients</span><b>${fmt(o.aed)} AED</b></div>

          <div><span>Envoyé à Naomie</span><b class="cell-good">${fmt(o.envoye)} AED</b></div>
        </div></div>`).join('')}</div>`
    : emptyState('chart', 'Aucune activité sur cette période.');

  return `

      <div class="actions"><button class="btn ghost" onclick="exportCsv(activeTx(statsRange(), ${agentId?`'${agentId}'`:'null'}), 'statistiques')">${ic('download')}Exporter</button></div>

      <div class="field"><label for="s-g">Regrouper par</label><select id="s-g" data-bind="st.group">
        <option value="day" ${g==='day'?'selected':''}>Jour</option><option value="week" ${g==='week'?'selected':''}>Semaine</option><option value="month" ${g==='month'?'selected':''}>Mois</option>
      </select></div>
    </div>
    <div class="kpis">
      ${kpi('Transactions', 'list', tx.length, '', `${tx.filter(t=>t.statut==='EN_ATTENTE').length} encore à payer`, '', true)}

      ${kpi('Frais encaissés', 'coins', fmt(frais), 'AED', '', 'gold')}
      ${kpi('Total encaissé', 'wallet', fmt(aed+frais), 'AED', 'Argent des clients et frais')}
      ${kpi('Versé au Burundi', 'send', fmt(sum(tx,'montant_bif'),0), 'BIF', '')}
      ${kpi('Envoyé à Naomie', 'inbox', fmt(envoye), 'AED', 'Réception confirmée', 'good')}
      ${kpi('Écart de la période', 'wallet', fmt(aed+frais-sum(tx,'frais_envoi_aed')-envoye), 'AED', "Encaissé moins frais d'envoi et envoyé", (aed+frais-sum(tx,'frais_envoi_aed')-envoye)>0?'bad':'good')}
      ${kpi('Moyenne par transaction', 'chart', fmt(tx.length ? aed/tx.length : 0), 'AED', '')}
    </div>
    ${panel(`Détail par ${gLabel}`, 'calendar', detail, { flush:true })}
    ${isStaff() && !s.agent ? panel('Par agent', 'users', bilanList(bilan(range), false), { flush:true, right:`<span class="count">${rangeText}</span>` }) : ''}`;
}
function exportCsv(list, name){
  if(!list.length){ toast('Rien à exporter sur cette sélection', 'bad'); return; }
  const cols = [['date','Date'],['agent_nom','Agent'],['client','Client'],['client_tel','Tél. client'],['beneficiaire','Bénéficiaire'],['beneficiaire_tel','Numéro bénéficiaire'],['mode_reception','Mode'],['montant_aed','Montant AED'],['frais_aed','Frais AED'],['taux_aed_usd','Taux AED/USD'],['taux_usd_bif','Taux USD/BIF'],['montant_usd','Montant USD'],['montant_bif','Montant BIF'],['methode_envoi',"Méthode d'envoi"],['frais_envoi_aed',"Frais d'envoi AED"],['statut','Statut'],['valide_par','Validé par']];
  const cell = v => { const s = String(v ?? '').replace(/"/g,'""'); return /[;"\n]/.test(s) ? `"${s}"` : s; };
  const num = v => String(v ?? '').replace('.', ',');
  const lines = [cols.map(c=>cell(tr(c[1]))).join(';')].concat(list.map(t=>cols.map(([k])=>{
    if(k==='statut') return cell(tr((TX_STATUTS[t.statut]||{}).label || t.statut));
    if(/montant|frais|taux/.test(k)) return num(t[k]);
    return cell(t[k]);
  }).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pax-${name}-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

          <div class="field" style="margin:10px 0 0;"><label for="ur-${u.id}">Rôle</label><select id="ur-${u.id}" onchange="setUserRole('${u.id}', this.value)">${roleOptions(u.role)}</select></div>
          <div class="actions" style="justify-content:flex-start;margin-top:10px;">${userActions(u)}</div>`}
        </div>`).join('')}</div>
      <div class="sub" style="padding:10px 16px;">Désactiver bloque l'accès sans effacer l'historique. « Mot de passe » permet de définir un nouveau mot de passe quand l'email de réinitialisation n'arrive pas.</div>`, { flush:true })}`;
}
function copyLink(){
  const i = document.getElementById('signupLink');
  const done = ()=>toast('Lien copié');
  if(navigator.clipboard) navigator.clipboard.writeText(i.value).then(done, ()=>{ i.select(); document.execCommand('copy'); done(); });
  else { i.select(); document.execCommand('copy'); done(); }
}

/* Account */
function pageAccount(){
  const p = state.profile;
  return `
    <div class="pagehead"><div><h1>Mon compte</h1><p>${esc(state.session.user.email)}</p></div></div>
    <div style="max-width:520px;">
      ${panel('Profil', 'user', `
        <div class="me"><div class="avatar">${esc(initials(p.nom))}</div><div class="who"><b style="color:var(--ink)">${esc(p.nom)}</b><span class="sub">${esc(ROLES[p.role]||p.role)}</span></div></div>`)}
      ${panel('Langue', 'globe', `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><span>${LANG==='en'?'English':'Français'}</span>${langSwitch()}</div>`)}
      ${panel('Changer mon mot de passe', 'lock', `
        <form id="passwordForm">
          <div class="field"><label for="a-p1">Nouveau mot de passe</label><input id="a-p1" type="password" name="password" minlength="6" required autocomplete="new-password"><span class="hint">6 caractères minimum</span></div>
          <div class="field"><label for="a-p2">Confirmer le mot de passe</label><input id="a-p2" type="password" name="password2" minlength="6" required autocomplete="new-password"></div>
          <button class="btn" type="submit">Mettre à jour le mot de passe</button>
        </form>`)}
      ${isAdmin() ? panel('Réinitialiser les opérations', 'alert', `
        <p style="margin:0 0 12px;">Efface toutes les transactions, tous les envois à Naomie et tous les paiements d'agents, pour repartir de zéro. Les comptes utilisateurs sont conservés.</p>
        <p class="sub" style="margin:0 0 14px;">Une copie de sauvegarde est faite automatiquement avant l'effacement. Pour effacer une seule transaction, utilisez le bouton Supprimer dans la liste des transactions.</p>
        <button class="btn danger" onclick="resetOperations()">${ic('trash')}Réinitialiser les opérations</button>`, { cls:'flag-bad' }) : ''}
      <button class="btn ghost block" onclick="signOut()">${ic('logout')}Se déconnecter</button>
    </div>`;
}

/* ---------- Handlers ---------- */
function attachPageHandlers(){
  // generic bindings for filters: data-bind="group.key"
  document.querySelectorAll('[data-bind]').forEach(el=>{
    const [grp, key] = el.dataset.bind.split('.');
    const evt = (el.tagName==='INPUT' && el.type!=='date') ? 'input' : 'change';
    el.addEventListener(evt, ()=>{
      state[grp][key] = el.value;
      if((grp==='st' || grp==='pf') && (key==='from' || key==='to')){
        const r = (grp==='st' ? statsRange() : profitsRange()) || [today(), today()];
        state[grp].from = key==='from' ? el.value : r[0];
        state[grp].to = key==='to' ? el.value : r[1];
        state[grp].preset = 'custom';
      }
      const pos = el.selectionStart;
      render();
      const again = document.querySelector(`[data-bind="${el.dataset.bind}"]`);
      if(again && evt==='input'){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    });
  });
  document.querySelectorAll('[data-preset]').forEach(b=> b.onclick = ()=>{
    const [grp, k] = b.dataset.preset.split(':');
    state[grp].preset = k;
    if(k==='custom' && !state[grp].from){ const r = presetRange('week'); state[grp].from = r[0]; state[grp].to = r[1]; }
    render();
  });

  const txForm = document.getElementById('txForm');
  if(txForm){
    const bifInput = txForm.querySelector('[name=montant_bif]');
    let touched = false;
    bifInput.addEventListener('input', ()=>{ touched = true; });
    const update = ()=>{
      const fd = new FormData(txForm);
      const aed = fd.get('montant_aed'), au = fd.get('taux_aed_usd'), ub = fd.get('taux_usd_bif');
      const c = computeTx(aed, au, ub);
      document.getElementById('cvAed').textContent = fmt(aed) + ' AED';
      document.getElementById('cvUsd').textContent = fmt(c.usd) + ' $';
      document.getElementById('cvBif').textContent = fmt(c.bif, 0) + ' BIF';
      document.getElementById('cvOp1').textContent = tr('÷ ' + (au ? fmt(au, 4) : 'taux'));
      document.getElementById('cvOp2').textContent = tr('× ' + (ub ? fmt(ub) : 'taux'));
      document.getElementById('cvNote').textContent = tr(c.bif
        ? `Calcul exact ${fmt(c.bifExact, 0)} BIF, arrondi au multiple de 50 BIF inférieur.`
        : 'Saisissez le montant et le taux du jour pour voir le calcul.');
      if(!touched) bifInput.value = c.bif || '';
      const fr = parseFloat(fd.get('frais_aed'))||0, fe = parseFloat(fd.get('frais_envoi_aed'))||0;
      document.getElementById('gainLine').textContent = tr(`Frais nets : ${fmt(fr)} − ${fmt(fe)} = ${fmt(fr-fe)} AED. Gain de l'agent : ${fmt((fr-fe)/2)} AED.`);
    };
    ['montant_aed','taux_aed_usd','taux_usd_bif'].forEach(n=>txForm.querySelector(`[name=${n}]`).addEventListener('input', ()=>{ touched = false; update(); }));
    ['frais_aed','frais_envoi_aed'].forEach(n=>txForm.querySelector(`[name=${n}]`).addEventListener('input', update));
    update();
    txForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(txForm);
      const btn = txForm.querySelector('button[type=submit]'); btn.disabled = true;
      const ok = await addTransaction({
        client: String(fd.get('client')).trim(),
        client_tel: String(fd.get('client_tel')||'').trim() || null,
        beneficiaire: String(fd.get('beneficiaire')).trim(),
        beneficiaire_tel: String(fd.get('beneficiaire_tel')||'').trim() || null,
        mode_reception: fd.get('mode_reception'),
        montant_aed: parseFloat(fd.get('montant_aed')),
        frais_aed: parseFloat(fd.get('frais_aed')) || 0,
        taux_aed_usd: parseFloat(fd.get('taux_aed_usd')),
        taux_usd_bif: parseFloat(fd.get('taux_usd_bif')),
        montant_bif: parseInt(fd.get('montant_bif'), 10),
        methode_envoi: fd.get('methode_envoi') || null,
        frais_envoi_aed: parseFloat(fd.get('frais_envoi_aed')) || 0,
        note: String(fd.get('note')||'').trim() || null,
      });
      if(ok) setPage('transactions'); else btn.disabled = false;
    };
  }

  const vsForm = document.getElementById('vsForm');
  if(vsForm){
    const amt = vsForm.querySelector('[name=montant_aed]');
    const fee = vsForm.querySelector('[name=frais]');
    let amtTouched = false;
    amt.addEventListener('input', ()=>{ amtTouched = true; });
    const recompute = ()=>{
      const checked = [...vsForm.querySelectorAll('[name=tx]:checked')];
      const n = checked.length;
      const gross = checked.reduce((a,c)=>a+(+c.dataset.gross||0),0);
      const f = parseFloat(fee.value)||0;
      const perTx = checked.reduce((a,c)=>a+(+c.dataset.fe||0),0);
      const deduct = f>0 ? f : perTx;
      const total = Math.round((gross - deduct)*100)/100;
      if(!amtTouched) amt.value = total>0 ? total : '';
      const box = document.getElementById('vsSummary');
      box.textContent = n ? tr(`${n} transaction(s) : ${fmt(gross)} AED − ${fmt(deduct)} AED de frais d'envoi = ${fmt(total)} AED.`)
        + (f>0 && n>1 ? ' ' + tr(`Soit ${fmt(f/n)} AED de frais par transaction.`) : '') : '';
    };
    vsForm.querySelectorAll('[name=tx]').forEach(cb=>cb.addEventListener('change', recompute));
    fee.addEventListener('input', recompute);
    vsForm.querySelectorAll('[data-check]').forEach(b=>b.onclick = ()=>{
      vsForm.querySelectorAll('[name=tx]').forEach(cb=>{ cb.checked = b.dataset.check==='all'; });
      recompute();
    });
    recompute();
    vsForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(vsForm);
      const btn = vsForm.querySelector('button[type=submit]'); btn.disabled = true;
      const ok = await addVersement({
        montant_aed: parseFloat(fd.get('montant_aed')),
        moyen: fd.get('methode') || null,
        methode: fd.get('methode') || null,
        frais: parseFloat(fd.get('frais')) || 0,
        note: String(fd.get('note')||'').trim() || null,
      }, fd.getAll('tx'));
      if(!ok) btn.disabled = false;
    };
  }

  const pw = document.getElementById('passwordForm');
  if(pw) pw.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(pw);
    if(fd.get('password') !== fd.get('password2')){ toast('Les deux mots de passe ne correspondent pas', 'bad'); return; }
    const { error } = await sb.auth.updateUser({ password: fd.get('password') });
    if(error){ toast(friendlyAuthError(error), 'bad'); return; }
    pw.reset(); toast('Mot de passe mis à jour');
  };
}

/* ---------- Start ---------- */
(async function boot(){
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY'){ state.recovery = true; state.session = session; render(); }
    else if(event==='SIGNED_OUT'){ state.session = null; state.profile = null; render(); }
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(session && !state.recovery){ await afterLogin(session); }
  else { state.session = session; render(); }
})();
</script>
