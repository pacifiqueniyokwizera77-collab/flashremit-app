<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashRemit — Dubaï · Bujumbura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101b19;
    --paper:#f2ede1;
    --surface:#0f2d29;
    --surface-2:#153934;
    --line: rgba(242,237,225,0.12);
    --gold:#c9a227;
    --gold-soft: rgba(201,162,39,0.18);
    --good:#5fae7a;
    --bad:#c0553f;
    --info:#5fa8d3;
    --text:#f2ede1;
    --text-dim: rgba(242,237,225,0.6);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .disp{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  #app{ display:flex; min-height:100vh; }

  /* SIDEBAR */
  nav.side{
    width:230px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--line); padding:24px 14px;
    display:flex; flex-direction:column; gap:4px;
  }
  .brand{ padding:0 10px 22px 10px; }
  .brand .disp{ font-size:19px; color:var(--gold); line-height:1.15;}
  .brand .sub{ font-size:11px; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase; margin-top:4px;}
  .navbtn{
    background:none; border:none; color:var(--text-dim); text-align:left;
    padding:10px 12px; border-radius:8px; font-size:14px; cursor:pointer;
    font-family:'Inter',sans-serif; display:flex; align-items:center; gap:9px;
  }
  .navbtn:hover{ background:var(--gold-soft); color:var(--text); }
  .navbtn.active{ background:var(--gold-soft); color:var(--gold); font-weight:600; }
  .navbtn .count{ margin-left:auto; background:var(--bad); color:#fff; font-size:11px; font-weight:700; border-radius:20px; padding:1px 7px; }

  .whoami{ margin-top:auto; border-top:1px solid var(--line); padding-top:16px; }
  .whoami label{ font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); }
  select{
    width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:13.5px;
  }
  .rolechip{ display:inline-block; font-size:10px; margin-top:8px; padding:3px 8px; border-radius:20px; background:var(--gold-soft); color:var(--gold); text-transform:uppercase; letter-spacing:0.06em; }

  /* MAIN */
  main{ flex:1; padding:32px 40px; max-width:1240px; min-width:0; }
  .pagehead{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px; gap:16px; }
  .pagehead h1{ font-size:26px; margin:0; }
  .pagehead p{ color:var(--text-dim); margin:6px 0 0 0; font-size:13.5px; }

  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .grid.g3{ grid-template-columns:repeat(3,1fr); }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  .stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); }
  .stat .val{ font-size:22px; margin-top:6px; }
  .stat .hint{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }
  .val.good{ color:var(--good); } .val.bad{ color:var(--bad); } .val.gold{ color:var(--gold); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:20px; }
  .card.alert{ border-color:var(--bad); }
  .card.warn{ border-color:var(--gold); }
  .card h2{ font-size:16px; margin:0 0 14px 0; }
  .card h3{font-size: 13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 12px 0; font-family:'Inter',sans-serif; font-weight:600;}

  .tablewrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.num, th.num{ text-align:right; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:rgba(255,255,255,0.02); }
  tfoot td{ font-weight:700; border-top:1px solid var(--line); }
  .sub2{ font-size:11.5px; color:var(--text-dim); }

  .stamp{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase; font-weight:700; border:1.5px solid; white-space:nowrap; }
  .s-attente{ color:#e0b84a; border-color:#e0b84a; }
  .s-payee{ color:var(--good); border-color:var(--good); }
  .s-annulee{ color:var(--text-dim); border-color:var(--line); }
  .s-envoye{ color:var(--info); border-color:var(--info); }

  .btn{ background:var(--gold); color:#241c05; border:none; padding:10px 16px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; }
  .btn:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:none; border:1px solid var(--line); color:var(--text); }
  .btn.good{ background:var(--good); color:#08210f; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn.danger{ background:var(--bad); color:#fff; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btnrow{ display:flex; gap:6px; flex-wrap:wrap; }

  .formrow{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .formrow.r3{ grid-template-columns:1fr 1fr 1fr; }
  .formrow.wide{ grid-template-columns:1fr; }
  .field label{ font-size:11.5px; color:var(--text-dim); display:block; margin-bottom:5px; }
  input{ width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:13.5px; }
  .calc{ background:var(--surface-2); border:1px dashed var(--gold); border-radius:var(--radius); padding:14px 16px; margin:4px 0 16px; font-size:13.5px; line-height:1.7; }
  .calc b{ color:var(--gold); }

  .lockednote{ color:var(--text-dim); background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--radius); padding:16px; font-size:13px; line-height:1.55; }
  .badge-role{ font-size:10px; padding:2px 7px; border-radius:5px; background:var(--surface-2); color:var(--text-dim); margin-left:6px; white-space:nowrap; }
  .empty{ color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center; }
  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .filters select{ width:auto; min-width:150px; }
  .linkbox{ display:flex; gap:8px; align-items:center; }
  .linkbox input{ font-family:'JetBrains Mono',monospace; font-size:12px; }
  .msg-ok{ color:var(--good); font-size:13px; margin-top:12px; }
  .msg-bad{ color:var(--bad); font-size:13px; margin-top:12px; }
  ::placeholder{ color: rgba(242,237,225,0.35); }

  /* ---------- RESPONSIVE (mobile / tablette) ---------- */
  @media (max-width: 900px){
    #app{ flex-direction:column; }
    nav.side{ width:100%; border-right:none; border-bottom:1px solid var(--line); padding:16px; }
    .brand{ padding-bottom:14px; }
    .whoami{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
    main{ padding:20px 16px; }
    .grid, .grid.g3{ grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
    .pagehead{ flex-direction:column; align-items:flex-start; gap:6px; }
    .pagehead h1{ font-size:21px; }
    .card{ padding:16px; }
    .formrow, .formrow.r3{ grid-template-columns:1fr; gap:10px; }
    .navbtn{ padding:12px; font-size:15px; }
  }
  @media (max-width: 480px){
    .grid, .grid.g3{ grid-template-columns:1fr; }
    main{ padding:16px 12px; }
    .stat .val{ font-size:20px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ================================
   CONFIGURATION SUPABASE
   ================================ */
const SUPABASE_URL = 'https://oeyzapqyyzdvwzoezisv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9leXphcHF5eXpkdnd6b2V6aXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MzgzMDcsImV4cCI6MjEwMzQxNDMwN30.IGZbDI0KpzG-hjZDFghTiMi9c84Lsfdbof0ej_qhyRw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Taux par défaut AED → USD (1 USD = 3,66 AED) */
const DEFAULT_AED_USD = 3.66;
/* Le montant BIF est arrondi vers le bas au multiple de 50 BIF */
const BIF_ROUND_STEP = 50;
const MODES_RECEPTION = ['Lumicash','Ecocash','Mobile Money','Banque','Cash (Bujumbura)'];
const ROLES = { ADMIN:'Admin', BUJA:'Bujumbura (validation)', AGENT:'Agent Dubaï' };

/* ---------- ETAT ---------- */
let state = {
  session: null,
  profile: null,
  profiles: [],
  transactions: [],
  versements: [],
  page: 'dashboard',
  authView: (location.hash === '#inscription') ? 'signup' : 'login',
  authError: '',
  authInfo: '',
  filters: { agent:'', statut:'', periode:'tout' },
};

const TX_STATUTS = {
  EN_ATTENTE: {label:'À payer', cls:'s-attente'},
  PAYEE:      {label:'Payée ✓', cls:'s-payee'},
  ANNULEE:    {label:'Annulée', cls:'s-annulee'},
};
const VS_STATUTS = {
  ENVOYE: {label:'Envoyé — à confirmer', cls:'s-envoye'},
  RECU:   {label:'Reçu ✓', cls:'s-payee'},
};

/* ---------- OUTILS ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n, dec=2){ const v = Number(n)||0; return v.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:dec}); }
function fmtBif(n){ return fmt(n, 0) + ' BIF'; }
function fmtAed(n){ return fmt(n, 2) + ' AED'; }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(){ return todayKey().slice(0,7); }
function fmtDate(d){ if(!d) return ''; const [y,m,j] = String(d).slice(0,10).split('-'); return `${j}/${m}/${y}`; }
function fmtDateTime(ts){ if(!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function role(){ return state.profile ? state.profile.role : null; }
function isAdmin(){ return role()==='ADMIN'; }
function isBuja(){ return role()==='BUJA'; }
function isStaff(){ return isAdmin() || isBuja(); }
function isAgent(){ return role()==='AGENT'; }
function signupLink(){ return location.origin + location.pathname + '#inscription'; }

/* Calcul : AED ÷ taux AED/USD = USD ; USD × taux USD/BIF = BIF (arrondi vers le bas au multiple de 50) */
function computeTx(aed, tauxAedUsd, tauxUsdBif){
  aed = Number(aed)||0; tauxAedUsd = Number(tauxAedUsd)||0; tauxUsdBif = Number(tauxUsdBif)||0;
  if(!aed || !tauxAedUsd || !tauxUsdBif) return {usd:0, bifExact:0, bif:0};
  const usd = aed / tauxAedUsd;
  const bifExact = usd * tauxUsdBif;
  const bif = Math.floor(bifExact / BIF_ROUND_STEP) * BIF_ROUND_STEP;
  return {usd, bifExact, bif};
}

function inPeriod(dateStr){
  const p = state.filters.periode;
  if(p==='jour') return dateStr === todayKey();
  if(p==='mois') return String(dateStr).slice(0,7) === monthKey();
  return true;
}

/* ---------- AUTH ---------- */
async function signIn(email, password){
  state.authError = ''; state.authInfo = '';
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error){
    state.authError = /confirm/i.test(error.message)
      ? "Votre email n'est pas encore confirmé. Ouvrez le lien reçu par email, puis reconnectez-vous."
      : "Email ou mot de passe incorrect.";
    render(); return;
  }
  await afterLogin(data.session);
}
async function signUp(nom, email, password){
  state.authError = ''; state.authInfo = '';
  const {data, error} = await sb.auth.signUp({
    email, password,
    options: { data: { nom }, emailRedirectTo: location.origin + location.pathname }
  });
  if(error){ state.authError = 'Erreur : ' + error.message; render(); return; }
  if(data.session){ await afterLogin(data.session); return; }
  state.authView = 'login';
  state.authInfo = "Compte créé ✅ Confirmez votre adresse en cliquant sur le lien reçu par email. Ensuite, l'administrateur activera votre accès.";
  history.replaceState(null, '', location.pathname);
  render();
}
async function signOut(){
  await sb.auth.signOut();
  state.session = null; state.profile = null;
  render();
}
async function afterLogin(session){
  state.session = session;
  const {data: profile} = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  state.profile = profile;
  if(location.hash === '#inscription') history.replaceState(null, '', location.pathname);
  if(profile && profile.statut === 'actif') await loadAll(); else render();
}

/* ---------- CHARGEMENT DONNEES ---------- */
async function loadAll(){
  const [{data: profiles}, {data: txs, error: e1}, {data: vs, error: e2}] = await Promise.all([
    sb.from('profiles').select('*').order('nom'),
    sb.from('transactions').select('*').order('created_at', {ascending:false}),
    sb.from('versements').select('*').order('created_at', {ascending:false}),
  ]);
  if(e1 || e2) console.error(e1 || e2);
  state.profiles = profiles || [];
  state.transactions = txs || [];
  state.versements = vs || [];
  render();
}

/* ---------- ACTIONS ---------- */
async function run(promise){
  const {error} = await promise;
  if(error){ alert('Erreur : ' + error.message); return false; }
  await loadAll();
  return true;
}
async function addTransaction(tx){
  return run(sb.from('transactions').insert({
    ...tx, agent_id: state.profile.id, agent_nom: state.profile.nom, date: todayKey(),
  }));
}
async function markPayee(id){
  if(!confirm("Confirmer que le bénéficiaire a bien été payé ?")) return;
  await run(sb.from('transactions').update({statut:'PAYEE', valide_par: state.profile.nom, valide_le: new Date().toISOString()}).eq('id', id));
}
async function markAttente(id){
  if(!confirm("Remettre cette transaction « à payer » ?")) return;
  await run(sb.from('transactions').update({statut:'EN_ATTENTE', valide_par: null, valide_le: null}).eq('id', id));
}
async function markAnnulee(id){
  if(!confirm("Annuler cette transaction ? Elle ne comptera plus dans les totaux.")) return;
  await run(sb.from('transactions').update({statut:'ANNULEE', valide_par: state.profile.nom, valide_le: new Date().toISOString()}).eq('id', id));
}
async function deleteTransaction(id){
  if(!confirm("Supprimer définitivement cette transaction ?")) return;
  await run(sb.from('transactions').delete().eq('id', id));
}
async function addVersement(v){
  return run(sb.from('versements').insert({
    ...v, agent_id: state.profile.id, agent_nom: state.profile.nom, date: todayKey(),
  }));
}
async function confirmVersement(id){
  if(!confirm("Confirmer que cet argent a bien été reçu à Bujumbura ?")) return;
  await run(sb.from('versements').update({statut:'RECU', confirme_par: state.profile.nom, confirme_le: new Date().toISOString()}).eq('id', id));
}
async function unconfirmVersement(id){
  if(!confirm("Annuler la confirmation de réception ?")) return;
  await run(sb.from('versements').update({statut:'ENVOYE', confirme_par: null, confirme_le: null}).eq('id', id));
}
async function deleteVersement(id){
  if(!confirm("Supprimer cet envoi ?")) return;
  await run(sb.from('versements').delete().eq('id', id));
}
async function activateUser(id){
  const sel = document.getElementById('role-'+id);
  const r = sel ? sel.value : 'AGENT';
  const pays = r==='AGENT' ? 'Dubaï' : 'Burundi';
  await run(sb.from('profiles').update({statut:'actif', role:r, pays, can_edit: r==='ADMIN'}).eq('id', id));
}
async function setUserRole(id, r){
  await run(sb.from('profiles').update({role:r, can_edit: r==='ADMIN', pays: r==='AGENT' ? 'Dubaï' : 'Burundi'}).eq('id', id));
}
async function toggleUserStatut(id, current){
  await run(sb.from('profiles').update({statut: current==='actif' ? 'inactif' : 'actif'}).eq('id', id));
}
async function renameUser(id, current){
  const nom = prompt('Nouveau nom :', current);
  if(!nom || !nom.trim() || nom.trim()===current) return;
  await run(sb.from('profiles').update({nom: nom.trim()}).eq('id', id));
}
async function refuseUser(id, nom){
  if(!confirm(`Refuser et supprimer la demande d'accès de ${nom} ?`)) return;
  await run(sb.from('profiles').delete().eq('id', id));
}

/* ---------- CALCULS ---------- */
/* Bilan par agent : clients, montants encaissés, frais, envoyé à Naomie, reste chez l'agent */
function bilanAgents(){
  const map = {};
  const ensure = (id, nom) => {
    if(!map[id]) map[id] = { id, nom, nbClients:0, aed:0, frais:0, usd:0, bif:0, bifPaye:0, nbAPayer:0, envoyeRecu:0, envoyeAttente:0 };
    return map[id];
  };
  state.profiles.filter(p=>p.role==='AGENT' && p.statut!=='en_attente').forEach(p=>ensure(p.id, p.nom));
  state.transactions.filter(t=>t.statut!=='ANNULEE' && inPeriod(t.date)).forEach(t=>{
    const a = ensure(t.agent_id, t.agent_nom);
    a.nbClients++; a.aed += +t.montant_aed; a.frais += +t.frais_aed; a.usd += +t.montant_usd; a.bif += +t.montant_bif;
    if(t.statut==='PAYEE') a.bifPaye += +t.montant_bif; else a.nbAPayer++;
  });
  state.versements.filter(v=>inPeriod(v.date)).forEach(v=>{
    const a = ensure(v.agent_id, v.agent_nom);
    if(v.statut==='RECU') a.envoyeRecu += +v.montant_aed; else a.envoyeAttente += +v.montant_aed;
  });
  return Object.values(map).map(a=>({ ...a, encaisse: a.aed + a.frais, reste: a.aed + a.frais - a.envoyeRecu }))
    .sort((x,y)=>x.nom.localeCompare(y.nom));
}
function totals(list){
  return list.reduce((s,a)=>{ Object.keys(a).forEach(k=>{ if(typeof a[k]==='number') s[k]=(s[k]||0)+a[k]; }); return s; }, {});
}
function txAPayer(){ return state.transactions.filter(t=>t.statut==='EN_ATTENTE'); }
function vsAConfirmer(){ return state.versements.filter(v=>v.statut==='ENVOYE'); }
function pendingUsers(){ return state.profiles.filter(p=>p.statut==='en_attente'); }

/* ---------- RENDU ---------- */
function render(){
  const app = document.getElementById('app');
  if(!state.session){ app.innerHTML = renderAuth(); attachAuthHandlers(); return; }
  if(!state.profile || state.profile.statut !== 'actif'){ app.innerHTML = renderWaiting(); return; }

  const nAPayer = txAPayer().length, nVs = vsAConfirmer().length, nUsers = pendingUsers().length;
  const nav = [];
  nav.push(navBtn('dashboard','◆ Tableau de bord'));
  if(isAgent() || isAdmin()) nav.push(navBtn('new','＋ Nouvelle transaction'));
  nav.push(navBtn('transactions', isAgent() ? '◆ Mes transactions' : '◆ Transactions', isStaff() ? nAPayer : 0));
  nav.push(navBtn('versements', isAgent() ? '◆ Envois à Naomie' : '◆ Argent reçu de Dubaï', isStaff() ? nVs : 0));
  if(isStaff()) nav.push(navBtn('bilan','◆ Bilan par agent'));
  if(isAdmin()) nav.push(navBtn('users','◆ Utilisateurs', nUsers));
  nav.push(navBtn('settings','◆ Mon compte'));

  app.innerHTML = `
    <nav class="side">
      <div class="brand">
        <div class="disp">FlashRemit</div>
        <div class="sub">Dubaï → Bujumbura</div>
      </div>
      ${nav.join('')}
      <div class="whoami">
        <label>Connecté en tant que</label>
        <div style="margin-top:6px; font-size:14px;">${esc(state.profile.nom)}</div>
        <div class="rolechip">${esc(ROLES[role()] || role())}</div>
        <button class="btn ghost small" style="margin-top:12px; width:100%;" onclick="signOut()">Se déconnecter</button>
      </div>
    </nav>
    <main>${renderPage()}</main>
  `;
  attachPageHandlers();
}

function renderAuth(){
  const signup = state.authView === 'signup';
  return `
  <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; padding:16px;">
    <div class="card" style="width:100%; max-width:380px;">
      <div class="disp" style="color:var(--gold); font-size:22px; margin-bottom:4px;">FlashRemit</div>
      <div style="color:var(--text-dim); font-size:13px; margin-bottom:20px;">${signup ? 'Créer mon compte agent' : 'Connexion à votre compte'}</div>
      <form id="authForm">

function attachAuthHandlers(){
  const f = document.getElementById('authForm');
  if(f) f.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(f);
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    if(state.authView==='signup') signUp(String(fd.get('nom')).trim(), fd.get('email'), fd.get('password'));
    else signIn(fd.get('email'), fd.get('password'));
  };
  const toL = document.getElementById('toLogin'), toS = document.getElementById('toSignup');
  if(toL) toL.onclick = (e)=>{ e.preventDefault(); state.authView='login'; state.authError=''; state.authInfo=''; render(); };
  if(toS) toS.onclick = (e)=>{ e.preventDefault(); state.authView='signup'; state.authError=''; state.authInfo=''; render(); };
}
function renderWaiting(){

function navBtn(id, label, count){
  return `<button class="navbtn ${state.page===id?'active':''}" onclick="setPage('${id}')">

function setPage(id){ state.page=id; render(); window.scrollTo(0,0); }

function renderPage(){
  switch(state.page){
    case 'new': return pageNew();

function tableTransactions(list){
  if(!list.length) return `<div class="empty">Aucune transaction.</div>`;
  return `<div class="tablewrap"><table><thead><tr>
    <th>Date</th>${isStaff()?'<th>Agent</th>':''}<th>Client</th><th>Bénéficiaire</th>
    <th class="num">AED</th><th class="num">Frais</th><th class="num">Taux</th><th class="num">BIF à payer</th><th>Statut</th><th></th>
  </tr></thead><tbody>
  ${list.map(t=>{
    const st = TX_STATUTS[t.statut] || {label:t.statut, cls:''};
    const actions = [];
    if(isStaff() && t.statut==='EN_ATTENTE') actions.push(`<button class="btn small good" onclick="markPayee('${t.id}')">✓ Payée</button>`);
    if(isStaff() && t.statut==='EN_ATTENTE') actions.push(`<button class="btn small ghost" onclick="markAnnulee('${t.id}')">Annuler</button>`);
    if(isStaff() && t.statut!=='EN_ATTENTE') actions.push(`<button class="btn small ghost" onclick="markAttente('${t.id}')">↺</button>`);
    if((isAdmin()) || (isAgent() && t.statut==='EN_ATTENTE')) actions.push(`<button class="btn small ghost" onclick="deleteTransaction('${t.id}')" title="Supprimer">🗑</button>`);
    return `<tr>
      <td class="mono">${fmtDate(t.date)}</td>
      ${isStaff()?`<td>${esc(t.agent_nom)}</td>`:''}
      <td>${esc(t.client)}${t.client_tel?`<div class="sub2">${esc(t.client_tel)}</div>`:''}</td>
      <td>${esc(t.beneficiaire)}<div class="sub2">${esc(t.mode_reception||'')} ${esc(t.beneficiaire_tel||'')}</div></td>
      <td class="num mono">${fmt(t.montant_aed)}</td>
      <td class="num mono">${fmt(t.frais_aed)}</td>
      <td class="num mono">${fmt(t.taux_usd_bif)}<div class="sub2">÷ ${fmt(t.taux_aed_usd,4)}</div></td>
      <td class="num mono" style="color:var(--gold); font-weight:700;">${fmt(t.montant_bif,0)}</td>
      <td><span class="stamp ${st.cls}">${st.label}</span>${t.valide_par?`<div class="sub2">${esc(t.valide_par)} · ${fmtDateTime(t.valide_le)}</div>`:''}</td>
      <td><div class="btnrow">${actions.join('')}</div></td>
    </tr>`;
  }).join('')}
  </tbody></table></div>`;
}

function pageUsers(){
  const pending = pendingUsers();
  const others = state.profiles.filter(p=>p.statut!=='en_attente');
  const roleOptions = (sel) => Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${sel===k?'selected':''}>${v}</option>`).join('');
  return `
    <div class="pagehead"><div>
      <h1>Utilisateurs</h1>
      <p>Donner ou retirer l'accès à l'application</p>
    </div></div>
    <div class="card">
      <h2>Lien d'inscription à envoyer aux nouveaux agents</h2>
      <div class="linkbox">
        <input id="signupLink" readonly value="${esc(signupLink())}">
        <button class="btn small" onclick="copyLink()">Copier</button>
      </div>
      <div class="sub2" style="margin-top:8px;">L'agent saisit son nom, son email et un mot de passe. Sa demande apparaît ci-dessous ; il ne voit rien tant que vous ne l'avez pas activé.</div>
    </div>
    <div class="card ${pending.length?'warn':''}">
      <h2>Demandes d'accès en attente (${pending.length})</h2>
      ${pending.length ? `<div class="tablewrap"><table><thead><tr><th>Nom</th><th>Email</th><th>Inscrit le</th><th>Rôle à donner</th><th></th></tr></thead><tbody>
        ${pending.map(u=>`<tr>
          <td>${esc(u.nom)}</td><td>${esc(u.email||'')}</td><td class="mono">${fmtDateTime(u.created_at)}</td>
          <td><select id="role-${u.id}">${roleOptions('AGENT')}</select></td>
          <td><div class="btnrow">
            <button class="btn small good" onclick="activateUser('${u.id}')">✓ Donner l'accès</button>
            <button class="btn small ghost" onclick="refuseUser('${u.id}', '${esc(u.nom).replace(/'/g,'&#39;')}')">Refuser</button>
          </div></td>
        </tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Aucune demande en attente.</div>`}
    </div>
    <div class="card">
      <h2>Comptes</h2>
      <div class="tablewrap"><table><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Statut</th><th></th></tr></thead><tbody>
        ${others.map(u=>{
          const me = u.id===state.profile.id;
          return `<tr>
            <td>${esc(u.nom)} ${me?'<span class="badge-role">vous</span>':''}</td>
            <td>${esc(u.email||'')}</td>
            <td>${me ? esc(ROLES[u.role]) : `<select onchange="setUserRole('${u.id}', this.value)">${roleOptions(u.role)}</select>`}</td>
            <td><span class="stamp ${u.statut==='actif'?'s-payee':'s-annulee'}">${u.statut}</span></td>
            <td><div class="btnrow">
              <button class="btn small ghost" onclick="renameUser('${u.id}', '${esc(u.nom).replace(/'/g,'&#39;')}')">Renommer</button>
              ${me?'':`<button class="btn small ghost" onclick="toggleUserStatut('${u.id}', '${u.statut}')">${u.statut==='actif'?'Désactiver':'Réactiver'}</button>`}
            </div></td>
          </tr>`;}).join('')}
      </tbody></table></div>
      <div class="sub2" style="margin-top:8px;">Désactiver bloque l'accès sans effacer l'historique de l'agent.</div>
    </div>`;
}
function copyLink(){
  const i = document.getElementById('signupLink');
  i.select();
  (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(
    ()=>alert('Lien copié ✅'),
    ()=>{ document.execCommand('copy'); alert('Lien copié ✅'); }
  );
}

/* ---------- MON COMPTE ---------- */
function pageSettings(){
  return `
    <div class="pagehead"><div>
      <h1>Mon compte</h1>
    </div></div>
    <div class="card" style="max-width:440px;">
      <h3>Compte connecté</h3>
      <div style="font-size:14px; margin-bottom:4px;">${esc(state.profile.nom)}</div>
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:20px;">${esc(state.session.user.email)} · ${esc(ROLES[role()])}</div>

      <form id="passwordForm">

        <div class="field" style="margin-bottom:16px;"><label>Confirmer le nouveau mot de passe</label><input type="password" name="password2" minlength="6" required></div>

        <button class="btn" type="submit">Mettre à jour le mot de passe</button>

}

/* ---------- FORMULAIRES ---------- */
function attachPageHandlers(){
  const txForm = document.getElementById('txForm');
  if(txForm){
    const bifInput = txForm.querySelector('[name=montant_bif]');
    let bifTouched = false;
    bifInput.addEventListener('input', ()=>{ bifTouched = true; });
    const update = ()=>{
      const fd = new FormData(txForm);
      const aed = fd.get('montant_aed'), tAU = fd.get('taux_aed_usd'), tUB = fd.get('taux_usd_bif');
      const c = computeTx(aed, tAU, tUB);
      const box = document.getElementById('calcBox');
      if(!c.bif){ box.innerHTML = 'Saisissez le montant et les taux pour voir le calcul.'; return; }
      box.innerHTML = `${fmt(aed)} AED ÷ ${fmt(tAU,4)} = <b>${fmt(c.usd)} $</b><br>
        ${fmt(c.usd)} $ × ${fmt(tUB)} = ${fmt(c.bifExact,0)} BIF → arrondi : <b>${fmt(c.bif,0)} BIF</b>`;
      if(!bifTouched) bifInput.value = c.bif;
    };
    ['montant_aed','taux_aed_usd','taux_usd_bif'].forEach(n=>txForm.querySelector(`[name=${n}]`).addEventListener('input', ()=>{ bifTouched=false; update(); }));
    update();
    txForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(txForm);
      const btn = txForm.querySelector('button[type=submit]'); btn.disabled = true;
      const ok = await addTransaction({
        client: String(fd.get('client')).trim(),
        client_tel: String(fd.get('client_tel')||'').trim() || null,
        beneficiaire: String(fd.get('beneficiaire')).trim(),
        beneficiaire_tel: String(fd.get('beneficiaire_tel')||'').trim() || null,
        mode_reception: fd.get('mode_reception'),
        montant_aed: parseFloat(fd.get('montant_aed')),
        frais_aed: parseFloat(fd.get('frais_aed')) || 0,
        taux_aed_usd: parseFloat(fd.get('taux_aed_usd')),
        taux_usd_bif: parseFloat(fd.get('taux_usd_bif')),
        montant_bif: parseInt(fd.get('montant_bif'), 10),
        note: String(fd.get('note')||'').trim() || null,
      });
      if(ok){ state.page = isAgent() ? 'transactions' : 'transactions'; render(); alert('Transaction enregistrée ✅'); }
      else btn.disabled = false;
    };
  }

  const vsForm = document.getElementById('vsForm');
  if(vsForm) vsForm.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(vsForm);
    await addVersement({
      montant_aed: parseFloat(fd.get('montant_aed')),
      moyen: String(fd.get('moyen')||'').trim() || null,
      note: String(fd.get('note')||'').trim() || null,
    });
  };

  const fAgent = document.getElementById('fAgent');
  if(fAgent) fAgent.onchange = ()=>{ state.filters.agent = fAgent.value; render(); };
  const fStatut = document.getElementById('fStatut');
  if(fStatut) fStatut.onchange = ()=>{ state.filters.statut = fStatut.value; render(); };
  const fPeriode = document.getElementById('fPeriode');
  if(fPeriode) fPeriode.onchange = ()=>{ state.filters.periode = fPeriode.value; render(); };

  const passwordForm = document.getElementById('passwordForm');
  if(passwordForm) passwordForm.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(passwordForm);
    const fb = document.getElementById('pwFeedback');
    const p1 = f.get('password'), p2 = f.get('password2');
    if(p1 !== p2){ fb.style.color='var(--bad)'; fb.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
    const {error} = await sb.auth.updateUser({password: p1});
    if(error){ fb.style.color='var(--bad)'; fb.textContent = 'Erreur : '+error.message; return; }
    fb.style.color='var(--good)'; fb.textContent = 'Mot de passe mis à jour.';
    passwordForm.reset();
  };
}

/* ---------- DEMARRAGE ---------- */
(async function boot(){
  const {data: {session}} = await sb.auth.getSession();
  if(session){ await afterLogin(session); } else { render(); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ state.session=null; state.profile=null; render(); }
    if(event === 'SIGNED_IN' && session && !state.session){ afterLogin(session); }
  });
})();
</script>
</body>
</html>
